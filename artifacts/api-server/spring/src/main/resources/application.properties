spring.application.name=secure-login-api
server.port=${PORT:8080}
server.servlet.context-path=/api
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.forward-headers-strategy=none

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=2500
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.keepalive-time=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 */5 * * * *
spring.session.timeout=30m

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

auth.password.bcrypt-strength=${AUTH_BCRYPT_STRENGTH:12}
auth.rate-limit.hmac-secret=${SESSION_SECRET}
auth.rate-limit.login-limit=${AUTH_LOGIN_LIMIT:12}
auth.rate-limit.login-window-seconds=${AUTH_LOGIN_WINDOW_SECONDS:300}
auth.rate-limit.register-limit=${AUTH_REGISTER_LIMIT:8}
auth.rate-limit.register-window-seconds=${AUTH_REGISTER_WINDOW_SECONDS:3600}
auth.rate-limit.cleanup-days=1

## Security hardening for production
# Force HTTPS-only session cookies in production and behind any TLS terminator.
# Set SESSION_COOKIE_SECURE=true in all production deployments.
# Allow secure cookies for the app only when using HTTPS; local HTTP should use false.

kind = "api"
previewPath = "/api" # API is routed under /api
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "bash artifacts/api-server/spring/run.sh"

[services.production]

[services.production.build]
args = ["bash", "artifacts/api-server/spring/build.sh"]

[services.production.run]
args = ["java", "-jar", "artifacts/api-server/spring/target/secure-login-api.jar"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
